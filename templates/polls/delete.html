{% extends "base.html" %}
{% block title %}Anketi Sil · Kararsızım{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Anketi sil</h1>
    <p>“{{ poll.question }}” anketini silmek istediğine emin misin? Oylar da silinir ve bu işlem geri alınamaz.</p>
    <form method="post" class="form-actions">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Evet, sil</button>
      <a href="{% url 'poll_detail' poll.pk %}">Vazgeç</a>
    </form>
  </div>
{% endblock %}
