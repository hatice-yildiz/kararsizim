[project]
name = "tahmince"
version = "0.1.0"
requires-python = ">=3.12"
# Not: requirements.txt ile aynı tutulmalı (Vercel pyproject.toml'u okuyabilir).
dependencies = [
    "Django>=5.2,<6.0",
    "psycopg[binary]",
    "dj-database-url",
    "python-dotenv",
    "whitenoise",
]

[tool.vercel]
entrypoint = "config.wsgi:application"
