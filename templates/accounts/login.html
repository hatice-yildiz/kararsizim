{% extends "base.html" %}
{% block title %}Giriş · Kararsızım{% endblock %}
{% block content %}
  <div class="form-card">
    <h1>Giriş</h1>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "accounts/_form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary">Giriş</button>
    </form>
    <p class="form-footer">Hesabın yok mu? <a href="/kayit/">Kayıt ol</a></p>
  </div>
{% endblock %}
