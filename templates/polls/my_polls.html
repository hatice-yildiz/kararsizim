{% extends "base.html" %}
{% block title %}Anketlerim · Kararsızım{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Anketlerim</h1>
  </div>
  {% for poll in polls %}
    {% include "polls/_card.html" %}
  {% empty %}
    <div class="empty">
      <p>Henüz anketin yok. İlk kararsızlığını paylaş! 🤔</p>
      <a href="{% url 'poll_create' %}" class="btn btn-primary">Anket Oluştur</a>
    </div>
  {% endfor %}
{% endblock %}
